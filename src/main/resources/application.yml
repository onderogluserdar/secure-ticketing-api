spring:
  application:
    name: secure-ticketing-api

  config:
    import: optional:file:.env[.properties],classpath:observability.yml

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ticketing}
    username: ${DB_USERNAME:ticketing}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

ticketing:
  rate-limit:
    login:
      capacity: 5
      refill-period: 1m

  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 7d

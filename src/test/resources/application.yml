spring:
  application:
    name: secure-ticketing-api

  config:
    # The real exposure policy, not a copy of it.
    import: classpath:observability.yml

  datasource:
    url: jdbc:h2:mem:ticketing;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 0

ticketing:
  rate-limit:
    login:
      capacity: 1000
      refill-period: 1m

  jwt:
    # Test fixture only
    secret: test-fixture-signing-key-not-used-outside-tests
    access-token-ttl: 15m
    refresh-token-ttl: 7d
